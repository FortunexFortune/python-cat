name: Terraform Apply

on:
  push:
    paths:
      - 'tf/**'
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: Terraform Apply-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: tf

permissions:
  pull-requests: write
  id-token: write
  contents: read

env:
  TF_VAR_repo: ${{ github.repository }}
  TF_VAR_environment: Dev

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::822304886948:role/SVC-Terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -out=tfplan -detailed-exitcode

      - name: Encrypt Terraform Plan
        run: |
          gpg --symmetric \
              --batch \
              --yes \
              --passphrase "${{ secrets.SALT }}" \
              --cipher-algo AES256 \
              --output tfplan.gpg \
              tfplan

      - name: Upload Encrypted Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tf/tfplan.gpg


  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment:
      name: dev-822304886948

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::822304886948:role/SVC-Terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: tf

      - name: Decrypt Terraform Plan
        run: |
          gpg --decrypt \
              --batch \
              --yes \
              --passphrase "${{ secrets.SALT }}" \
              --output tfplan \
              tfplan.gpg

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
