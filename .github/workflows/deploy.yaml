name: Deploy to Minikube on EC2 via SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ansible-${{ github.ref}}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ANSIBLE_FORCE_COLOR: 'true'

jobs:
  deploy:
    name: Deploy Ansible Playbook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ansible
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - uses: unfor19/install-aws-cli-action@v1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::822304886948:role/SVC-Terraform

      - name: Set up SSH
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > private_key.pem
          chmod 400 private_key.pem
          
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Ansible + dependencies
        shell: bash
        run: |
          pip3 install ansible
          pip3 install botocore
          pip3 install boto3

      - name: view inventory
        run: |
          ansible-inventory -i aws_ec2.yml --graph

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHA_PACKAGES }}

      - name: Run Ansible Playbook
        env:
          ANSIBLE_USER: ubuntu
          ANSIBLE_HOST_KEY_CHECKING: False
          GHCR_USERNAME: FortunexFortune
          GHCR_TOKEN: ${{ secrets.GHA_PACKAGES }}
        run: |
          ansible-playbook -i aws_ec2.yml site.yml --private-key private_key.pem -u ${{ env.ANSIBLE_USER }} 