apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-cat
  namespace: python-cat
  labels:
    app: python-cat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-cat
  template:
    metadata:
      labels:
        app: python-cat
    spec:
      containers:
      - name: python-cat
        image: ghcr.io/fortunexfortune/python-cat:v0.0.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
