[defaults]
inventory = aws_ec2.yml
sudo_user = root
remote_port = 22
host_key_checking = False
callback_whitelist = profile_tasks
timeout = 30

[inventory]
becom=True
become_method=sudo
become_user=root
enable_plugins = aws_ec2

[ssh_connection]
ssh_args = -F ./ssh.cfg -o ControlMaster=no
pipeline = True
